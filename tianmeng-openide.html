<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#4a90e2" />
<title>天梦OpenIDE</title>
<!-- Marked.js 用于 Markdown 渲染 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Highlight.js 用于代码高亮 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css" id="hljs-light" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" id="hljs-dark" disabled />
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  /* ========== 全局变量 & 重置 ========== */
  :root {
    /* 白蓝配色 */
    --primary: #4a90e2;
    --primary-deep: #357abd;
    --primary-light: #e8f1fb;
    --accent: #6ab0ff;
    --bg-gradient-1: #f0f6ff;
    --bg-gradient-2: #dce8f7;
    --surface: rgba(255, 255, 255, 0.72);
    --surface-solid: #ffffff;
    --surface-hover: rgba(255, 255, 255, 0.85);
    --text-primary: #1a2a44;
    --text-secondary: #5a6b85;
    --text-muted: #94a3b8;
    --border: rgba(74, 144, 226, 0.18);
    --border-strong: rgba(74, 144, 226, 0.32);
    --shadow-sm: 0 2px 8px rgba(74, 144, 226, 0.08);
    --shadow-md: 0 8px 24px rgba(74, 144, 226, 0.14);
    --shadow-lg: 0 16px 48px rgba(74, 144, 226, 0.2);
    --bubble-user: linear-gradient(135deg, #4a90e2 0%, #6ab0ff 100%);
    --bubble-user-text: #ffffff;
    --bubble-ai: rgba(255, 255, 255, 0.85);
    --bubble-ai-text: #1a2a44;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-blur: 24px;
    --code-bg: #f6f8fa;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-xl: 28px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* 暗黑模式变量 */
  [data-theme="dark"] {
    --primary: #5ba0f2;
    --primary-deep: #7ab6ff;
    --primary-light: rgba(91, 160, 242, 0.15);
    --bg-gradient-1: #0c1a2e;
    --bg-gradient-2: #142441;
    --surface: rgba(28, 45, 75, 0.72);
    --surface-solid: #1c2d4b;
    --surface-hover: rgba(40, 60, 95, 0.85);
    --text-primary: #e8eef7;
    --text-secondary: #a8b8d0;
    --text-muted: #6a7c96;
    --border: rgba(91, 160, 242, 0.18);
    --border-strong: rgba(91, 160, 242, 0.4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6);
    --bubble-user: linear-gradient(135deg, #3a7ed1 0%, #5ba0f2 100%);
    --bubble-ai: rgba(40, 60, 95, 0.85);
    --bubble-ai-text: #e8eef7;
    --glass-bg: rgba(20, 36, 65, 0.55);
    --code-bg: #1b2a42;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--text-primary);
    background: linear-gradient(160deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
    background-attachment: fixed;
    position: relative;
    transition: all 0.35s ease;
    font-size: 15px;
    line-height: 1.6;
    /* 禁用默认长按菜单/文本选择光标，后面精确放开 */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* 自定义背景图 */
  body.custom-bg {
    background: none !important;
  }
  body.custom-bg::before {
    content: "";
    position: fixed; inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
  }
  body.custom-bg::after {
    content: "";
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: -1;
  }
  [data-theme="dark"].custom-bg::after { background: rgba(10, 20, 40, 0.55); }

  /* ========== 主容器 ========== */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }

  /* ========== 顶部导航 ========== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border-bottom: 1px solid var(--border);
    z-index: 50;
    flex-shrink: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
  }
  .brand-logo {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px;
    box-shadow: var(--shadow-sm);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
  .brand-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-secondary);
  }
  .icon-btn:hover { background: var(--surface-hover); transform: translateY(-1px); }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn svg { width: 18px; height: 18px; fill: currentColor; stroke: currentColor; stroke-width: 2; fill: none; }

  /* ========== 聊天区域 ========== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    padding-bottom: 160px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

  .msg-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 70%;
    color: var(--text-muted);
    text-align: center;
    padding: 20px;
  }
  .msg-empty-icon {
    width: 88px; height: 88px;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    margin-bottom: 18px;
    box-shadow: var(--shadow-md);
    opacity: 0.92;
  }
  .msg-empty-icon svg { width: 42px; height: 42px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .msg-empty-title { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
  .msg-empty-desc { font-size: 13px; max-width: 280px; }

  /* 能力快捷卡 */
  .quick-skills {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 22px;
    max-width: 360px;
    width: 100%;
  }
  .skill-card {
    padding: 12px;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
  }
  .skill-card:hover { transform: translateY(-2px); background: var(--surface-hover); box-shadow: var(--shadow-sm); }
  .skill-card:active { transform: scale(0.97); }
  .skill-icon {
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--primary-light);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
  }
  .skill-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }
  .skill-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .skill-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* 消息气泡 */
  .msg-row {
    display: flex; margin-bottom: 16px;
    animation: msgFadeIn 0.35s ease;
    position: relative;
  }
  @keyframes msgFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai { justify-content: flex-start; }

  .msg-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  .msg-row.user .msg-avatar {
    background: linear-gradient(135deg, #ff9a8b 0%, #ff6a88 100%);
    color: #fff; margin-left: 8px; order: 2;
  }
  .msg-row.ai .msg-avatar {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color: #fff; margin-right: 8px;
  }

  .msg-wrapper { max-width: calc(100% - 58px); display: flex; flex-direction: column; }
  .msg-row.user .msg-wrapper { align-items: flex-end; }

  .msg-bubble {
    padding: 11px 14px;
    border-radius: var(--radius-lg);
    position: relative;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
    cursor: default;
    /* 允许气泡内文本选择 —— 但我们会在JS里屏蔽系统光标，用自定义菜单 */
    -webkit-user-select: text;
    user-select: text;
  }
  .msg-row.user .msg-bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 6px;
  }
  .msg-row.ai .msg-bubble {
    background: var(--bubble-ai);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--bubble-ai-text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }

  /* 多选模式 */
  .msg-row.selectable .msg-bubble::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: calc(var(--radius-lg) + 4px);
    border: 2px dashed var(--primary);
    opacity: 0.5;
    pointer-events: none;
  }
  .msg-row.selected .msg-bubble {
    box-shadow: 0 0 0 2px var(--primary), var(--shadow-md);
  }
  .msg-row.selected .msg-bubble::after {
    content: "✓";
    position: absolute;
    top: -8px; right: -8px;
    width: 22px; height: 22px;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  .msg-row.user.selected .msg-bubble::after { right: -8px; left: auto; }
  .msg-row.ai.selected .msg-bubble::after { left: -8px; right: auto; }

  .msg-meta {
    font-size: 10px; color: var(--text-muted);
    margin-top: 4px;
    padding: 0 6px;
  }

  /* 消息中的Markdown内容样式 */
  .msg-content { font-size: 14.5px; line-height: 1.7; }
  .msg-content p { margin: 0 0 8px 0; }
  .msg-content p:last-child { margin-bottom: 0; }
  .msg-content h1, .msg-content h2, .msg-content h3,
  .msg-content h4, .msg-content h5, .msg-content h6 {
    margin: 10px 0 8px; font-weight: 700; line-height: 1.3;
  }
  .msg-content h1 { font-size: 1.4em; }
  .msg-content h2 { font-size: 1.25em; }
  .msg-content h3 { font-size: 1.12em; }
  .msg-row.user .msg-content h1,
  .msg-row.user .msg-content h2,
  .msg-row.user .msg-content h3 { color: #fff; }

  .msg-content ul, .msg-content ol { padding-left: 22px; margin: 6px 0; }
  .msg-content li { margin: 2px 0; }
  .msg-content blockquote {
    margin: 8px 0; padding: 8px 12px;
    border-left: 3px solid var(--primary);
    background: rgba(74,144,226,0.08);
    border-radius: 0 8px 8px 0;
    color: var(--text-secondary);
  }
  .msg-row.user .msg-content blockquote {
    border-left-color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.92);
  }

  .msg-content a { color: var(--primary); text-decoration: underline; word-break: break-all; }
  .msg-row.user .msg-content a { color: #ffe4b0; }

  .msg-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0;
    font-size: 13px;
    overflow-x: auto;
    display: block;
  }
  .msg-content th, .msg-content td {
    border: 1px solid var(--border-strong);
    padding: 6px 10px;
    text-align: left;
  }
  .msg-content th { background: var(--primary-light); font-weight: 600; }
  .msg-row.user .msg-content th { background: rgba(255,255,255,0.2); }

  .msg-content img { max-width: 100%; border-radius: 8px; margin: 6px 0; }

  .msg-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }

  /* 内联代码 */
  .msg-content code:not(pre code) {
    padding: 2px 6px;
    background: var(--code-bg);
    color: #e74c3c;
    border-radius: 5px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.9em;
  }
  .msg-row.user .msg-content code:not(pre code) {
    background: rgba(255,255,255,0.18);
    color: #ffe0a8;
  }

  /* 代码块 */
  .code-block {
    margin: 10px 0;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--code-bg);
    border: 1px solid var(--border);
  }
  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px;
    background: rgba(0,0,0,0.04);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-secondary);
  }
  [data-theme="dark"] .code-head { background: rgba(255,255,255,0.04); }
  .code-lang { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .code-actions { display: flex; gap: 6px; }
  .code-btn {
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    transition: all 0.15s ease;
  }
  .code-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .code-btn.copied { background: #22c55e; color: #fff; border-color: #22c55e; }

  .code-block pre {
    margin: 0; padding: 12px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.55;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: text;
    user-select: text;
  }
  .code-block pre code {
    background: none !important;
    padding: 0 !important;
    color: inherit !important;
    font-size: inherit !important;
  }

  /* HTML预览区 */
  .html-preview {
    margin: 10px 0;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border);
    background: #fff;
  }
  [data-theme="dark"] .html-preview { background: #fff; }
  .html-preview-head {
    padding: 7px 12px;
    background: var(--primary-light);
    color: var(--primary-deep);
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .html-preview iframe {
    width: 100%;
    min-height: 240px;
    border: none;
    background: #fff;
    display: block;
  }

  /* 消息附件(图片/文件) */
  .msg-attachments { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .attach-img {
    max-width: 240px; max-height: 240px;
    border-radius: var(--radius-md);
    object-fit: cover;
    cursor: zoom-in;
    box-shadow: var(--shadow-sm);
    border: 2px solid rgba(255,255,255,0.3);
  }
  .attach-file {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.5);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 12px;
    max-width: 260px;
  }
  .msg-row.user .attach-file { background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.3); }
  .attach-file-icon {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .attach-file-icon svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
  .attach-file-info { flex: 1; overflow: hidden; }
  .attach-file-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attach-file-size { font-size: 10px; opacity: 0.75; }

  /* 思考中动画 */
  .typing {
    display: inline-flex; gap: 4px; padding: 6px 4px;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted);
    animation: typing 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* 消息操作按钮组 */
  .msg-actions-row {
    display: flex; gap: 6px; margin-top: 6px;
    width: min(95%, 340px);
  }
  .msg-action-btn {
    flex: 1;
    padding: 5px 8px;
    font-size: 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .msg-action-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* 导出文档按钮 */
  .export-doc-row {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--primary-light);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .export-doc-label {
    font-size: 12px; font-weight: 600; color: var(--primary-deep);
    display: flex; align-items: center; gap: 6px;
  }
  .export-doc-label svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
  .export-doc-btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .export-btn {
    padding: 4px 9px;
    font-size: 11px;
    border-radius: 6px;
    background: var(--surface-solid);
    border: 1px solid var(--border-strong);
    color: var(--primary-deep);
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  .export-btn:hover { background: var(--primary); color: #fff; }

  /* ========== 底部输入区 ========== */
  .input-area {
    flex-shrink: 0;
    padding: 10px 12px calc(10px + var(--safe-bottom));
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border-top: 1px solid var(--border);
    z-index: 40;
  }
  /* 多选模式顶部栏 */
  .select-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 10px;
  }
  .select-bar.active { display: flex; }
  .select-info { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .select-bar-actions { display: flex; gap: 6px; }
  .btn {
    padding: 7px 14px;
    font-size: 13px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.18s ease;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(74, 144, 226, 0.4); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary {
    background: var(--surface);
    color: var(--text-secondary);

<script>
/* =============================================================
 * 天梦OpenIDE - 主逻辑
 * 单文件应用 · HTML+CSS+原生JS
 * ============================================================= */
'use strict';

/* ---------- 1. 全局状态 & 本地存储 ---------- */
const LS_KEY = 'tianmeng_openide_v1';
// 接口提供商默认配置
const PROVIDER_DEFAULTS = {
  zhipu:    { name: '智谱AI GLM',   url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4-flash' },
  deepseek: { name: 'DeepSeek V3',  url: 'https://api.deepseek.com/v1/chat/completions',          model: 'deepseek-chat' },
  yuanbao:  { name: '腾讯元宝',     url: 'https://yuanbao.tencent.com/v1/chat/completions',       model: 'yuanbao-lite' },
  openai:   { name: 'OpenAI GPT',   url: 'https://api.openai.com/v1/chat/completions',            model: 'gpt-4o-mini' }
};
const TAG_CLASS = { zhipu:'tag-zhipu', deepseek:'tag-deepseek', yuanbao:'tag-yuanbao', openai:'tag-openai' };

// 应用配置
let config = {
  provider: 'zhipu',
  apiKey: '',
  apiUrl: '',
  model: '',
  aiName: '天梦OpenIDE',
  bgImage: '',
  theme: 'light'
};
// 当前会话消息
let messages = []; // [{id, role, content, time, attachments:[{type,data,name,size}], isDoc?, docContent?}]
// 会话历史列表
let sessionList = []; // [{id, title, time, preview, messages:[]}]
// 当前会话ID
let currentSessionId = null;
// 待发送附件
let pendingAttachments = [];
// 多选模式
let selectMode = false;
let selectedMsgIds = new Set();
// 当前输入模式
let inputMode = 'text'; // 'text' | 'code'

// 工具函数
const $  = (sel, p=document) => p.querySelector(sel);
const $$ = (sel, p=document) => Array.from(p.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const escapeHTML = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatTime = (t) => {
  const d = new Date(t);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
};
const formatDate = (t) => {
  const d = new Date(t);
  return `${d.getMonth()+1}月${d.getDate()}日 ${formatTime(t)}`;
};
const formatSize = (n) => {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
};

/* ---------- 2. 持久化 ---------- */
function saveAll() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      config, sessionList, currentSessionId
    }));
  } catch(e) { console.warn('保存失败', e); }
}
function loadAll() {
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s) {
      const d = JSON.parse(s);
      Object.assign(config, d.config || {});
      sessionList = d.sessionList || [];
      currentSessionId = d.currentSessionId || null;
      if (currentSessionId) {
        const sess = sessionList.find(x => x.id === currentSessionId);
        messages = sess ? [...sess.messages] : [];
      }
    }
  } catch(e) { console.warn('读取失败', e); }
}

/* ---------- 3. 主题应用 ---------- */
function applyTheme() {
  document.body.setAttribute('data-theme', config.theme);
  $('#iconThemeLight').style.display = config.theme === 'light' ? '' : 'none';
  $('#iconThemeDark').style.display  = config.theme === 'dark' ? '' : 'none';
  $('#hljs-light').disabled = config.theme !== 'light';
  $('#hljs-dark').disabled  = config.theme !== 'dark';
}
function applyBG() {
  if (config.bgImage) {
    document.body.classList.add('custom-bg');
    document.body.style.setProperty('--custom-bg', `url(${config.bgImage})`);
    const bgStyle = document.getElementById('customBgStyle') || (() => {
      const s = document.createElement('style');
      s.id = 'customBgStyle';
      document.head.appendChild(s);
      return s;
    })();
    bgStyle.textContent = `body.custom-bg::before{ background-image: var(--custom-bg); }`;
    $('#bgPreview').style.backgroundImage = `url(${config.bgImage})`;
    $('#bgPreview').classList.add('has-image');
  } else {
    document.body.classList.remove('custom-bg');
    $('#bgPreview').style.backgroundImage = '';
    $('#bgPreview').classList.remove('has-image');
  }
}
function applyAIName() {
  const n = config.aiName || '天梦OpenIDE';
  $('#aiNameDisplay').textContent = n;
  $('#greetName').textContent = n;
  document.title = n;
  const p = PROVIDER_DEFAULTS[config.provider];
  $('#aiProviderDisplay').textContent = config.apiKey ? `${p?.name || '自定义'} · 已就绪` : '未配置 API Key';
}

/* ---------- 4. Markdown 渲染 & 代码块处理 ---------- */
marked.setOptions({
  breaks: true, gfm: true,
  highlight: function(code, lang) {
    try {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
      return hljs.highlightAuto(code).value;
    } catch(e){ return code; }
  }
});

/**
 * 将AI返回的原始文本(可能是Markdown)渲染为HTML，并拆分代码块、加入HTML预览、导出文档等。
 * 返回 {html, hasHTMLBlocks, isLongDoc, docText}
 */
function renderMarkdownToRich(raw) {
  // 判断是否是"长文档"(>800字且有明显文档结构: 标题# 等)，用于显示导出文档按钮
  const textOnly = String(raw || '');
  const isLongDoc = textOnly.length > 800 ||
    /^\s{0,3}#\s+.+$/m.test(textOnly) && textOnly.length > 400;

  // 1) 先提取代码块，避免 marked 对 ``` 内的内容做渲染
  const codeBlocks = [];
  let processed = textOnly.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (m, lang, code) => {
    const id = uid();
    codeBlocks.push({ id, lang: lang || 'plain', code });
    return `\x00CODEBLOCK_${id}\x00`;
  });

  // 2) Marked 渲染其余部分
  let html;
  try {
    html = marked.parse(processed);
  } catch(e) {
    html = '<p>' + escapeHTML(processed).replace(/\n/g,'<br>') + '</p>';
  }

  // 3) 回填代码块，附带 复制/预览按钮，HTML 代码额外附预览 iframe
  let hasHTMLBlocks = false;
  for (const cb of codeBlocks) {
    const escapedCode = escapeHTML(cb.code);
    let previewHtml = '';
    const langLow = String(cb.lang).toLowerCase();
    if (langLow === 'html' || langLow === 'htm') {
      hasHTMLBlocks = true;
      const srcDoc = `<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:8px;font-family:-apple-system,sans-serif;}</style></head><body>${cb.code}</body></html>`;
      previewHtml = `<div class="html-preview">
        <div class="html-preview-head"><span>🖥 HTML 实时预览</span><button class="code-btn" onclick="refreshIframe(this)">刷新</button></div>
        <iframe srcdoc="${escapeHTML(srcDoc).replace(/"/g,'&quot;')}" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
      </div>`;
    }
    const blockHtml = `<div class="code-block" data-lang="${escapeHTML(cb.lang)}">
      <div class="code-head">
        <span class="code-lang">${escapeHTML(cb.lang || 'code')}</span>
        <div class="code-actions">
          <button class="code-btn" onclick="copyCodeBlock(this)">复制</button>
        </div>
      </div>
      <pre><code class="hljs language-${escapeHTML(cb.lang)}">${escapedCode}</code></pre>
    </div>${previewHtml}`;
    html = html.replace(new RegExp(`\\x00CODEBLOCK_${cb.id}\\x00`, 'g'), blockHtml);
  }

  return { html, hasHTMLBlocks, isLongDoc, docText: textOnly };
}

// 代码块一键复制
window.copyCodeBlock = function(btn) {
  const pre = btn.closest('.code-block').querySelector('pre code');
  const text = pre.innerText;
  copyToClipboard(text).then(() => {
    const old = btn.textContent;
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1200);
  });
};
// iframe 刷新
window.refreshIframe = function(btn) {
  const iframe = btn.closest('.html-preview').querySelector('iframe');
  iframe.src = iframe.src;
};

// 复制到剪贴板（兼容 HTTP 环境）
async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e) {}
  try {
    const ta = $('#hiddenTA');
    ta.value = text;
    ta.style.display = 'block';
    ta.select();
    ta.setSelectionRange(0, text.length);
    document.execCommand('copy');
    ta.style.display = '';
    return true;
  } catch(e) {
    toast('复制失败：' + (e.message || '未知错误'));
    return false;
  }
}

/* ---------- 5. Toast ---------- */
let toastTimer = null;
function toast(msg, duration=1800) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), duration);
}

/* ---------- 6. 消息渲染 ---------- */
function scrollToBottom() {
  const area = $('#chatArea');
  requestAnimationFrame(() => area.scrollTop = area.scrollHeight);
}

function formatAttachmentsHTML(list, isUser) {
  if (!list || !list.length) return '';
  let html = '<div class="msg-attachments">';
  for (const a of list) {
    if (a.type === 'image') {
      html += `<img class="attach-img" src="${a.data}" alt="${escapeHTML(a.name||'image')}" onclick="previewBigImage('${a.data}')" />`;
    } else {
      html += `<div class="attach-file">
        <div class="attach-file-icon"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
        <div class="attach-file-info">
          <div class="attach-file-name">${escapeHTML(a.name||'文件')}</div>
          <div class="attach-file-size">${formatSize(a.size||0)}</div>
        </div>
      </div>`;
    }
  }
  html += '</div>';
  return html;
}

// 大图预览
window.previewBigImage = function(src) {
  const mask = document.createElement('div');
  mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99998;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);';
  mask.onclick = () => mask.remove();
  const img = document.createElement('img');
  img.src = src;
  img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;';
  mask.appendChild(img);
  document.body.appendChild(mask);
};

function renderMessage(msg) {
  const row = document.createElement('div');
  row.className = `msg-row ${msg.role}`;
  row.dataset.id = msg.id;
  if (selectMode) row.classList.add('selectable');
  if (selectedMsgIds.has(msg.id)) row.classList.add('selected');

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = msg.role === 'user' ? '我' : (config.aiName || 'AI').slice(0,1);

  const wrap = document.createElement('div');
  wrap.className = 'msg-wrapper';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  // 长按时通过此元素判定所属消息
  bubble.dataset.msgId = msg.id;

  let contentHTML = '';
  if (msg.role === 'ai') {
    const rendered = renderMarkdownToRich(msg.content || '');
    contentHTML = `<div class="msg-content">${rendered.html}</div>`;
    // 导出文档按钮
    if (rendered.isLongDoc) {
      contentHTML += `<div class="export-doc-row">
        <div class="export-doc-label"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>该内容可导出为文档</div>
        <div class="export-doc-btns">
          <button class="export-btn" onclick="exportDoc('${msg.id}','md')">Markdown</button>
          <button class="export-btn" onclick="exportDoc('${msg.id}','txt')">TXT</button>
          <button class="export-btn" onclick="exportDoc('${msg.id}','docx')">Word</button>
        </div>
      </div>`;
    }
  } else {
    // 用户消息：含代码块时用Markdown渲染，否则纯文本转义
    if (/```/.test(msg.content || '')) {
      const rendered = renderMarkdownToRich(msg.content || '');
      contentHTML = `<div class="msg-content">${rendered.html}</div>`;
    } else {
      contentHTML = `<div class="msg-content">${escapeHTML(msg.content||'').replace(/\n/g,'<br>')}</div>`;
    }
  }

  // 附件
  contentHTML += formatAttachmentsHTML(msg.attachments);
  bubble.innerHTML = contentHTML;

  // 时间戳
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = formatTime(msg.time);

  wrap.appendChild(bubble);
  wrap.appendChild(meta);

  // 布局：AI → avatar在左；user → avatar在右
  if (msg.role === 'ai') {
    row.appendChild(avatar);
    row.appendChild(wrap);
  } else {
    row.appendChild(wrap);
    row.appendChild(avatar);
  }

  // 多选模式：点击切换选中
  bubble.addEventListener('click', (e) => {
    if (!selectMode) return;
    e.stopPropagation();
    toggleSelect(msg.id);
  });

  return row;
}

// 空状态HTML模板（缓存避免被innerHTML清除后丢失）
let _emptyHTML = '';
function renderAllMessages() {
  const area = $('#chatArea');
  area.innerHTML = '';
  if (!messages.length) {
    // 重建空状态
    area.innerHTML = _emptyHTML || (_emptyHTML = createEmptyHTML());
    return;
  }
  for (const m of messages) {
    area.appendChild(renderMessage(m));
  }
  scrollToBottom();
  // 代码高亮
  $$('#chatArea pre code').forEach(block => {
    try { hljs.highlightElement(block); } catch(e){}
  });
}
// 生成空状态欢迎页HTML
function createEmptyHTML() {
  const aiName = (typeof config !== 'undefined' && config.aiName) || '天梦OpenIDE';
  return `<div class="msg-empty" id="msgEmpty">
      <div class="msg-empty-icon">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
      </div>
      <div class="msg-empty-title">你好，我是 <span id="greetName">${escapeHTML(aiName)}</span></div>
      <div class="msg-empty-desc">已接入先进大模型，助你问答、写代码、创作文档、查询天气……开始你的对话吧！</div>
      <div class="quick-skills">
        <div class="skill-card" data-preset="帮我写一篇关于人工智能的短文，500字左右。">
          <div class="skill-icon"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></div>
          <div class="skill-title">撰写文章</div>
          <div class="skill-desc">作文、论文、文案</div>
        </div>
        <div class="skill-card" data-preset="用 Python 写一个快速排序算法，并简要解释思路。">
          <div class="skill-icon"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg></div>
          <div class="skill-title">代码编写</div>
          <div class="skill-desc">多语言编程支持</div>
        </div>
        <div class="skill-card" data-preset="现在的准确时间和日期是？顺便告诉我今天适合做什么。">
          <div class="skill-icon"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
          <div class="skill-title">时间与规划</div>
          <div class="skill-desc">日程与方案建议</div>

/* ---------- 7. 文档导出 ---------- */
window.exportDoc = function(msgId, type) {
  const msg = messages.find(x => x.id === msgId);
  if (!msg) return;
  const content = msg.content || '';
  const title = extractTitle(content) || `天梦文档_${formatDate(Date.now()).replace(/[^\d]/g,'')}`;
  let blob, filename;

  if (type === 'md') {
    blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
    filename = `${title}.md`;
  } else if (type === 'txt') {
    // MD转纯文本（移除# 等标记）
    const plain = content
      .replace(/^#{1,6}\s+/gm, '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/```[\s\S]*?```/g, (m) => m.replace(/```.*?\n?/g,''))
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/[-*_]{3,}/g, '---');
    blob = new Blob([plain], { type: 'text/plain;charset=utf-8' });
    filename = `${title}.txt`;
  } else if (type === 'docx') {
    // 简易 Word (HTML 格式，Word 可打开，另存为 docx)
    const htmlBody = (function(){ try { return marked.parse(content); } catch(e){ return escapeHTML(content).replace(/\n/g,'<br>'); } })();
    const wordHTML = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset='utf-8'><title>${escapeHTML(title)}</title>
<style>
body{font-family:'Microsoft YaHei',sans-serif;font-size:12pt;line-height:1.7;color:#222;}
h1{font-size:22pt;color:#1a2a44;margin:18px 0 10px;}
h2{font-size:18pt;color:#1a2a44;margin:16px 0 8px;}
h3{font-size:15pt;color:#357abd;margin:14px 0 6px;}
p{margin:8px 0;}
table{border-collapse:collapse;margin:10px 0;}
th,td{border:1px solid #888;padding:6px 10px;}
th{background:#e8f1fb;}
code{background:#f2f2f2;padding:1px 4px;border-radius:3px;font-family:Consolas,monospace;}
pre{background:#f6f8fa;padding:12px;border-radius:6px;font-family:Consolas,monospace;white-space:pre-wrap;}
blockquote{border-left:3px solid #4a90e2;padding:6px 12px;color:#555;margin:10px 0;}
</style></head>
<body>
<h1 style='text-align:center;border-bottom:2px solid #4a90e2;padding-bottom:8px;'>${escapeHTML(title)}</h1>
${htmlBody}
</body></html>`;
    blob = new Blob(['\ufeff', wordHTML], { type: 'application/msword' });
    filename = `${title}.doc`;
  }

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('已导出：' + filename);
};
function extractTitle(text) {
  const m = /^#\s+(.+)$/m.exec(text);
  if (m) return m[1].trim().slice(0,40);
  const first = text.trim().split(/\n/)[0] || '';
  return first.replace(/[#*`]/g,'').trim().slice(0,40);
}

  // 定位，防止越界

function closeContextMenu() {
  const m = $('#customContextMenu');
  if (m) m.remove();
  removeSelectionPop();
  menuTargetMsgId = null;
}

function handleMenuAction(act, x, y) {
  const id = menuTargetMsgId;
  if (!id) { closeContextMenu(); return; }
  const msg = messages.find(m => m.id === id);
  if (!msg) { closeContextMenu(); return; }

  if (act === 'copyAll') {
    copyToClipboard(msg.content || '').then(ok => ok && toast('已复制全文'));
    closeContextMenu();
  } else if (act === 'partial') {
    // 关闭菜单，允许用户在气泡内自由选区，弹"复制选中文本"浮窗
    closeContextMenu();
    toast('请拖动手指选取要复制的文字', 1800);

    window._allowSelectionMode = true;
    setTimeout(() => { window._allowSelectionMode = false; removeSelectionPop(); }, 15000);
  } else if (act === 'singleDelete') {
    closeContextMenu();
    deleteSingleMessage(id);

    closeContextMenu();
    enterSelectMode();
    toggleSelect(id);
  }
}

// 长按绑定到 chatArea（事件委托）
(function bindLongPress() {
  const area = $('#chatArea');
  area.addEventListener('touchstart', onTouchStart, { passive: true });
  area.addEventListener('touchend', onTouchEnd);
  area.addEventListener('touchmove', onTouchMove, { passive: true });
  area.addEventListener('touchcancel', onTouchEnd);
  area.addEventListener('mousedown', onMouseDown);
  area.addEventListener('mouseup', onMouseUp);
  area.addEventListener('contextmenu', (e) => {
    // 屏蔽系统右键/长按菜单
    if (e.target.closest('.msg-bubble')) {
      e.preventDefault();
    }
  });
})();

function findMsgBubble(target) {
  return target.closest('.msg-bubble');
}
function onTouchStart(e) {
  const b = findMsgBubble(e.target);
  if (!b) return;
  const t = e.touches[0];
  pressStartPos = { x: t.clientX, y: t.clientY };
  longPressTriggered = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    longPressTriggered = true;
    if (navigator.vibrate) try { navigator.vibrate(20); } catch(e){}
    openContextMenu(t.clientX, t.clientY, b.dataset.msgId);
  }, 480);
}
function onTouchMove(e) {
  if (window._allowSelectionMode) return;
  const t = e.touches && e.touches[0];
  if (!t) return;
  const dx = Math.abs(t.clientX - pressStartPos.x);
  const dy = Math.abs(t.clientY - pressStartPos.y);
  if (dx > 8 || dy > 8) {
    clearTimeout(longPressTimer);
  }
}
function onTouchEnd(e) {
  clearTimeout(longPressTimer);
  // 若长按触发过，阻止后续 click/默认文本选择
  if (longPressTriggered) {
    longPressTriggered = false;
    // 防止 iOS 出现放大镜/文本选择光标
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
  }
}
function onMouseDown(e) {
  const b = findMsgBubble(e.target);
  if (!b) return;
  if (e.button !== 2) return; // 仅右键
  pressStartPos = { x: e.clientX, y: e.clientY };
  longPressTriggered = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    longPressTriggered = true;
    openContextMenu(e.clientX, e.clientY, b.dataset.msgId);
  }, 500);
}
function onMouseUp(e) {
  clearTimeout(longPressTimer);
}

// 选区复制浮窗
let _selPop = null;
function showSelectionPop() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim()) { removeSelectionPop(); return; }
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  if (!rect || !rect.width) return;
  if (!_selPop) {
    _selPop = document.createElement('div');
    _selPop.className = 'selection-pop';
    _selPop.textContent = '📋 复制选中内容';
    _selPop.onclick = () => {
      const txt = (window.getSelection() || '').toString();
      copyToClipboard(txt).then(ok => { if (ok) toast('已复制选中内容'); removeSelectionPop(); window.getSelection()?.removeAllRanges(); window._allowSelectionMode = false; });
    };
    document.body.appendChild(_selPop);
  }
  let px = rect.left + rect.width / 2 - 70;
  let py = rect.top - 40;
  if (py < 5) py = rect.bottom + 8;
  if (px < 8) px = 8;
  if (px + 140 > window.innerWidth - 8) px = window.innerWidth - 148;
  _selPop.style.left = px + 'px';
  _selPop.style.top = py + 'px';
  _selPop.style.display = '';
}
function removeSelectionPop() {
  if (_selPop) { _selPop.remove(); _selPop = null; }
}

function bindUploads() {

  $('#fileImg').onchange = (e) => handleFileInput(e.target.files, 'image');

function handleBgFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('请上传图片文件'); return; }
  if (file.size > 3 * 1024 * 1024) { toast('图片大小不能超过 3MB'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    config.bgImage = ev.target.result;
    applyBG();
    toast('背景已更新，保存设置后生效');
  };
  reader.readAsDataURL(file);
}
function handleFileInput(files, mode) {
  if (!files || !files.length) return;
  for (const file of files) {
    if (mode === 'image' && !file.type.startsWith('image/')) {
      toast(`${file.name} 不是图片`);
      continue;
    }
    if (file.size > 10 * 1024 * 1024) {
      toast(`${file.name} 超过 10MB`);
      continue;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingAttachments.push({
        type: mode === 'image' ? 'image' : 'file',
        data: ev.target.result,
        name: file.name,
        size: file.size,
        mime: file.type
      });
      renderAttachPreview();
      updateSendBtn();
    };
    if (mode === 'image') reader.readAsDataURL(file);
    else reader.readAsDataURL(file);
  }
  // 清空 input，避免选同名文件不触发 change
  $('#fileImg').value = '';
  $('#fileFile').value = '';
  $('#fileBg').value = '';
}
function renderAttachPreview() {
  const box = $('#attachPreview');
  box.innerHTML = '';
  pendingAttachments.forEach((a, i) => {
    const item = document.createElement('div');
    item.className = 'attach-preview-item';
    if (a.type === 'image') {
      item.innerHTML = `<img src="${a.data}" /><button class="remove" data-i="${i}">×</button>`;
    } else {
      const ext = (a.name || '').split('.').pop().slice(0, 4).toUpperCase() || 'FILE';
      item.innerHTML = `<div class="file-icon"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>${ext}</span></div><button class="remove" data-i="${i}">×</button>`;
    }
    box.appendChild(item);
  });
  box.classList.toggle('active', pendingAttachments.length > 0);
  box.querySelectorAll('.remove').forEach(btn => {
    btn.onclick = () => {
      pendingAttachments.splice(+btn.dataset.i, 1);
      renderAttachPreview();
      updateSendBtn();
    };
  });
}

/* ---------- 12. 会话管理 ---------- */
function ensureSession() {
  if (!currentSessionId) {
    currentSessionId = uid();
    sessionList.unshift({
      id: currentSessionId,
      title: '新对话',
      time: Date.now(),
      preview: '',
      messages: []
    });
  }
  return sessionList.find(s => s.id === currentSessionId);
}
function saveSession() {
  const sess = ensureSession();
  sess.messages = messages;
  if (messages.length) {
    sess.time = Date.now();
    const firstUserMsg = messages.find(m => m.role === 'user');
    sess.title = firstUserMsg ? (firstUserMsg.content || '').slice(0, 20) : '新对话';
    if (!sess.title) sess.title = '新对话';
    const lastMsg = messages[messages.length - 1];
    sess.preview = (lastMsg.content || '').slice(0, 40);
  }
  saveAll();
}
function newChat() {

    saveSession();
  }

  currentSessionId = null;
  exitSelectMode();
  renderAllMessages();
  saveAll();

/* ---------- 13. 发送 & AI 响应 ---------- */
function getCurrentInput() {
  if (inputMode === 'code') {
    const code = $('#codeInputText').value;
    const lang = $('#codeLang').value;
    if (!code.trim()) return '';
    return `\`\`\`${lang}\n${code}\n\`\`\``;
  }
  return $('#inputText').value;
}

async function trySend() {
  const text = getCurrentInput().trim();
  const atts = pendingAttachments.length ? JSON.parse(JSON.stringify(pendingAttachments)) : [];
  if (!text && !atts.length) return;

  // 确保会话
  ensureSession();

  // 加入用户消息
  const userMsg = {
    id: uid(), role: 'user', content: text,
    time: Date.now(), attachments: atts
  };
  messages.push(userMsg);
  renderAllMessages();

  // 清空输入
  $('#inputText').value = '';
  $('#codeInputText').value = '';
  pendingAttachments = [];
  renderAttachPreview();
  updateSendBtn();
  $('#inputText').style.height = 'auto';
  $('#codeInputText').style.height = 'auto';
  $('#charCount').textContent = '0';

  saveSession();

  // 处理内置能力（无API Key也能使用的）
  const localHandled = await handleLocalAbilities(text);
  if (localHandled) return;

  // 生成AI占位
  const aiMsg = {
    id: uid(), role: 'ai', content: '',
    time: Date.now(), attachments: [],
    _typing: true
  };
  messages.push(aiMsg);
  renderAllMessages();
  scrollToBottom();
  // 显示思考中
  const lastRow = $('#chatArea').lastElementChild;
  if (lastRow) {
    const bubble = lastRow.querySelector('.msg-bubble');
    if (bubble) bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  }

  // 如果没配置 API Key
  if (!config.apiKey) {
    aiMsg._typing = false;
    aiMsg.content = '⚠️ 尚未配置 API Key 哦～\n\n请点击右上角「⚙设置」，选择接口厂商并填写 API Key 后即可使用在线 AI 能力。\n\n目前仍可使用以下内置能力：\n- 获取当前时间与日期\n- 历史记录/多选删除\n- 代码框复制、HTML 代码预览\n- 文档导出 (md/txt/Word)';
    updateAIMsg(aiMsg);
    saveSession();
    return;
  }

  // 构造请求
  const prov = PROVIDER_DEFAULTS[config.provider] || PROVIDER_DEFAULTS.zhipu;
  const url = config.apiUrl || prov.url;
  const model = config.model || prov.model;

  // 构造 messages payload（含最近 20 条历史，控制 token）
  const payloadMsgs = [];
  // System Prompt
  payloadMsgs.push({
    role: 'system',
    content: '你是"' + (config.aiName||'天梦OpenIDE') + '"，由白天鹅工作室打造的智能助手。\n' +
'请严格遵循以下输出格式规则：\n' +
'1. 简短对话、表格、要点说明等 → 使用 Markdown 输出。\n' +
'2. 长文章、论文、作文、方案、报告等（>400字）→ 使用 Markdown 输出，并且内容以 # 标题 开头。\n' +
'3. 输出代码时，使用三个反引号+语言名 作为代码块标记，确保代码块完整。\n' +
'4. 当用户要求写 HTML 页面时，使用 html 代码块输出完整 HTML。\n' +
'5. 回答要简洁、专业、友善；中文回答优先。'
  });
  const recent = messages.filter(m => m.role !== 'system').slice(-20);
  for (const m of recent) {
    if (m.role === 'user') {
      let c = m.content || '';
      if (m.attachments && m.attachments.length) {
        const fileDescs = m.attachments.map(a => {
          if (a.type === 'image') return `[图片附件:${a.name||'image'} ${formatSize(a.size)}]`;
          return `[文件附件:${a.name||'file'} ${formatSize(a.size)}]`;
        }).join('\n');
        c = (c ? c + '\n\n' : '') + fileDescs;
      }
      payloadMsgs.push({ role: 'user', content: c });
    } else if (m.role === 'ai' && m.content) {
      payloadMsgs.push({ role: 'assistant', content: m.content });
    }
  }

  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`
      },
      body: JSON.stringify({
        model,
        messages: payloadMsgs,
        stream: false,
        temperature: 0.8,
        max_tokens: 4096
      })
    });
    if (!resp.ok) {
      const errTxt = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errTxt.slice(0,200)}`);
    }
    const data = await resp.json();
    let answer = '';
    if (data?.choices?.[0]?.message?.content) {
      answer = data.choices[0].message.content;
    } else if (data?.choices?.[0]?.delta?.content) {
      answer = data.choices[0].delta.content;
    } else if (data?.data) {
      // 某些厂商返回结构不同
      answer = typeof data.data === 'string' ? data.data : JSON.stringify(data.data).slice(0,4000);
    } else {
      answer = '❌ 未能解析响应：\n```json\n' + JSON.stringify(data, null, 2).slice(0,2000) + '\n```';
    }
    aiMsg._typing = false;
    aiMsg.content = answer;
    updateAIMsg(aiMsg);
  } catch(err) {
    aiMsg._typing = false;
    aiMsg.content = `❌ 请求失败：${err.message || err}\n\n请检查：\n- API Key 是否正确\n- 接口地址是否可访问\n- 当前网络是否允许跨域\n- 服务商余额是否充足`;
    updateAIMsg(aiMsg);
  }
  saveSession();
}

function updateAIMsg(msg) {
  // 找到行并替换渲染
  const row = $(`.msg-row[data-id="${msg.id}"]`);
  if (!row) { renderAllMessages(); return; }
  const newRow = renderMessage(msg);
  row.replaceWith(newRow);
  // 高亮
  newRow.querySelectorAll('pre code').forEach(block => {
    try { hljs.highlightElement(block); } catch(e){}
  });
  scrollToBottom();
}

/* ---------- 14. 本地内置能力（无需API） ---------- */
async function handleLocalAbilities(text) {
  if (!text) return false;
  const t = text.trim();
  const low = t.toLowerCase();

  // 时间 & 日期
  if (/(现在|当前|今天|此刻).*(时间|几点|日期|几号|星期)/.test(t) ||
      /^[现在]*时间[?？]?$/.test(t) ||
      /^[今现]*日期[?？]?$/.test(t)) {
    const now = new Date();
    const weekdays = ['日','一','二','三','四','五','六'];
    const out = `🕒 当前信息\n\n| 项目 | 内容 |\n| --- | --- |\n| 日期 | ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 |\n| 时间 | ${formatTime(now)}:${String(now.getSeconds()).padStart(2,'0')} |\n| 星期 | 星期${weekdays[now.getDay()]} |\n| 时区 | ${Intl.DateTimeFormat().resolvedOptions().timeZone} |\n| 时间戳 | ${now.getTime()} |\n\n💡 提示：建议合理安排作息，保持专注高效～`;
    pushLocalAI(out);
    return true;
  }

  // 天气 —— 调用公开API (wttr.in 无 Key 免费，但需要网络)
  const weatherMatch = t.match(/(?:查询|查一下|今天|明天|最近).*?([\u4e00-\u9fa5A-Za-z]+).*?天气/);
  const cityWeather = weatherMatch && weatherMatch[1] ? weatherMatch[1] :
    (/(.+?)的?天气/.test(t) ? /(.+?)的?天气/.exec(t)[1] : null);
  if (cityWeather && /天气/.test(t)) {
    await fetchWeather(cityWeather);
    return true;
  }

  return false;
}

async function fetchWeather(city) {
  const aiMsg = { id: uid(), role: 'ai', content: '', time: Date.now(), attachments: [], _typing:true };
  messages.push(aiMsg);
  renderAllMessages();
  const lastRow = $('#chatArea').lastElementChild;
  if (lastRow) {
    const b = lastRow.querySelector('.msg-bubble');
    if (b) b.innerHTML = `<div class="typing"><span></span><span></span><span></span></div> 查询"${city}"天气中…`;
  }
  scrollToBottom();
  try {
    const resp = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1&lang=zh`, { cache: 'no-store' });
    if (!resp.ok) throw new Error('网络错误 ' + resp.status);
    const d = await resp.json();
    const cur = d.current_condition?.[0] || {};
    const area = d.nearest_area?.[0] || {};
    const locationName = area.areaName?.[0]?.value || area.region?.[0]?.value || city;
    const today = d.weather?.[0] || {};
    const astro = today.astronomy?.[0] || {};
    const desc = cur.lang_zh?.[0]?.value || cur.weatherDesc?.[0]?.value || '—';
    const out = `🌤 **${locationName}** 天气信息\n\n### 当前实况\n| 项目 | 内容 |\n| --- | --- |\n| 天气 | ${desc} |\n| 温度 | ${cur.temp_C}°C（体感 ${cur.FeelsLikeC}°C） |\n| 湿度 | ${cur.humidity}% |\n| 风速 | ${cur.windspeedKmph} km/h ${cur.winddir16Point} |\n| 能见度 | ${cur.visibility} km |\n| 气压 | ${cur.pressure} hPa |\n| 紫外线指数 | ${cur.uvIndex} |\n\n### 今日预报\n|  | 最高温 | 最低温 | 日出 | 日落 |\n| --- | --- | --- | --- | --- |\n| **今日** | ${today.maxtempC}°C | ${today.mintempC}°C | ${astro.sunrise} | ${astro.sunset} |\n\n💡 出行建议：${cur.temp_C < 10 ? '天气较冷，建议添衣保暖。' : cur.temp_C > 30 ? '天气炎热，注意防晒补水。' : '温度适宜，适合外出活动。'}${parseInt(cur.humidity) > 80 ? '湿度较高，可能有雨，建议带伞。' : ''}`;
    aiMsg._typing = false;
    aiMsg.content = out;
    updateAIMsg(aiMsg);
  } catch(e) {
    aiMsg._typing = false;
    aiMsg.content = `🌤 未能从公开天气服务获取 **${city}** 的天气信息（${e.message}）。\n\n请检查网络或稍后再试。若已配置 API Key，也可直接向 AI 询问天气相关建议。`;
    updateAIMsg(aiMsg);
  }
  saveSession();
}

function pushLocalAI(content) {
  const aiMsg = { id: uid(), role: 'ai', content, time: Date.now(), attachments: [] };
  messages.push(aiMsg);
  renderAllMessages();
  saveSession();
}

/* ---------- 15. 顶栏按钮绑定 ---------- */
function bindTopbar() {
  $('#btnNewChat').onclick = newChat;
  $('#btnTheme').onclick = () => {
    config.theme = config.theme === 'light' ? 'dark' : 'light';
    applyTheme();
    saveAll();
    toast(config.theme === 'dark' ? '已切换到暗黑模式' : '已切换到明亮模式');
  };
  $('#btnSettings').onclick = openSettings;
  $('#btnHistory').onclick = openHistory;

  $('#btnEnterSelect').onclick = () => {
    if (!messages.length) { toast('暂无消息可管理'); return; }
    if (selectMode) exitSelectMode();
    else enterSelectMode();
  };
  $('#btnCancelSelect').onclick = exitSelectMode;
  $('#btnSelectAll').onclick = () => {
    if (selectedMsgIds.size === messages.length) {
      selectedMsgIds.clear();
    } else {
      messages.forEach(m => selectedMsgIds.add(m.id));
    }
    $('#selectCount').textContent = selectedMsgIds.size;
    $$('.msg-row').forEach(r => r.classList.toggle('selected', selectedMsgIds.has(r.dataset.id)));
  };
  $('#btnDeleteSelected').onclick = deleteSelectedMessages;
}

/* ---------- 16. 设置弹窗 ---------- */
function openSettings() {
  // 回填
  $$('#providerGroup .radio-item').forEach(r => {
    r.classList.toggle('active', r.dataset.provider === config.provider);
  });
  $('#inputApiKey').value = config.apiKey || '';
  $('#inputApiUrl').value = config.apiUrl || '';
  $('#inputModel').value = config.model || '';
  $('#inputAIName').value = config.aiName || '';
  applyBG(); // bgPreview 已在 applyBG 更新
  $('#settingsMask').classList.add('show');
}
function closeSettings() { $('#settingsMask').classList.remove('show'); }

function bindSettings() {
  $$('#providerGroup .radio-item').forEach(r => {
    r.onclick = () => {
      $$('#providerGroup .radio-item').forEach(x => x.classList.remove('active'));
      r.classList.add('active');
      const prov = r.dataset.provider;
      config.provider = prov;
      // 自动填入默认 URL/模型(仅当当前为空时)
      const def = PROVIDER_DEFAULTS[prov];
      if (def && !$('#inputApiUrl').value) $('#inputApiUrl').placeholder = def.url;
      if (def && !$('#inputModel').value) $('#inputModel').placeholder = def.model;
    };
  });
  // 初始 placeholder
  const p = PROVIDER_DEFAULTS[config.provider];
  $('#inputApiUrl').placeholder = p?.url || '';
  $('#inputModel').placeholder = p?.model || '';

  $('#btnCancelSettings').onclick = closeSettings;
  $('#btnClearBg').onclick = () => {
    config.bgImage = '';
    applyBG();
    toast('已恢复默认背景');
  };
  $('#btnSaveSettings').onclick = () => {
    const prov = ($$('#providerGroup .radio-item.active')[0] || {}).dataset.provider || config.provider;
    config.provider = prov;
    config.apiKey = $('#inputApiKey').value.trim();
    config.apiUrl = $('#inputApiUrl').value.trim();
    config.model = $('#inputModel').value.trim();
    const name = $('#inputAIName').value.trim();
    if (name) config.aiName = name;
    else config.aiName = '天梦OpenIDE';
    applyTheme();
    applyBG();
    applyAIName();
    saveAll();
    closeSettings();
    toast('设置已保存');
    // 如果配置了API，把空状态欢迎描述更新一下
  };
  // 点击遮罩关闭
  $('#settingsMask').addEventListener('click', (e) => {
    if (e.target === $('#settingsMask')) closeSettings();
  });
}

/* ---------- 17. 历史记录弹窗 ---------- */
function openHistory() {
  const list = $('#historyList');
  list.innerHTML = '';
  if (!sessionList.length) {
    list.innerHTML = `<div style="padding:40px 10px;text-align:center;color:var(--text-muted);font-size:13px;">暂无历史会话</div>`;
    $('#historyMask').classList.add('show');
    return;
  }
  for (const s of sessionList) {
    const item = document.createElement('div');
    item.style.cssText = `
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    `;
    item.onmouseover = () => { item.style.background = 'var(--surface-hover)'; item.style.transform = 'translateY(-1px)'; };
    item.onmouseout  = () => { item.style.background = 'var(--surface)'; item.style.transform = ''; };
    const title = s.title || '新对话';
    const preview = s.preview || '（空会话）';
    const count = s.messages ? s.messages.length : 0;
    item.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHTML(title)}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${escapeHTML(preview)}</div>
          <div style="font-size:10.5px;color:var(--text-muted);">${formatDate(s.time)} · ${count} 条消息</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
          <button class="btn btn-secondary" style="padding:4px 8px;font-size:11px;border-radius:8px;" data-act="load">载入</button>
          <button class="btn btn-secondary" style="padding:4px 8px;font-size:11px;border-radius:8px;background:rgba(239,68,68,0.1);color:#ef4444;border-color:rgba(239,68,68,0.3);" data-act="del">删除</button>
        </div>
      </div>
    `;
    item.querySelector('[data-act="load"]').onclick = (e) => {
      e.stopPropagation();
      currentSessionId = s.id;
      messages = [...(s.messages || [])];
      exitSelectMode();
      renderAllMessages();
      saveAll();
      closeHistory();
      toast('已载入会话：' + title);
    };
    item.querySelector('[data-act="del"]').onclick = (e) => {
      e.stopPropagation();
      if (!confirm('删除该会话？此操作不可恢复。')) return;
      sessionList = sessionList.filter(x => x.id !== s.id);
      if (currentSessionId === s.id) { messages = []; currentSessionId = null; renderAllMessages(); }
      saveAll();
      openHistory();
      toast('已删除');
    };
    list.appendChild(item);
  }
  $('#historyMask').classList.add('show');
}
function closeHistory() { $('#historyMask').classList.remove('show'); }
function bindHistory() {
  $('#btnCloseHistory').onclick = closeHistory;
  $('#historyMask').addEventListener('click', (e) => {
    if (e.target === $('#historyMask')) closeHistory();
  });
  $('#btnClearAllHistory').onclick = () => {
    if (!sessionList.length) { toast('没有历史记录'); return; }
    if (!confirm('确定清空所有会话历史？此操作不可恢复！')) return;
    sessionList = [];
    currentSessionId = null;
    messages = [];
    renderAllMessages();
    saveAll();
    openHistory();
    toast('已清空所有历史');
  };
}

/* ---------- 18. 初始化 ---------- */
function init() {
  loadAll();
  applyTheme();
  applyBG();
  applyAIName();
  renderAllMessages();

  bindTopbar();
  bindUploads();
  bindInput();
  bindSettings();
  bindHistory();

  updateSendBtn();
}

// DOM就绪后启动
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
