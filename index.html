<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>WebCatX</title>
	</head>
    <style type="text/css">
         body{
             padding-top: 1px;
             background-color: #E6E6E6;
             margin: 0; 
         }
         .box{
             width: 330px;
             height: 100px;
             background-color: #FFFFFF;
             margin: 0 auto;
             border-radius: 20px;
             padding: 5px;
             box-sizing: border-box;
             display: flex;
             align-items: center; 
         }
         .box img{
             width: 170px; 
             border-radius: 15px;
             display: block;
             margin-right: 15px; 
             
         }
         .text-group{
             display: flex;
             flex-direction: column;
             justify-content: center;
             max-width: 120px; 
         }
         .title-main{
             margin: 0; 
             font-size: 18px; 
             font-weight: bold;
             white-space: nowrap; 
             color: #000;
         }
         .title-sub{
             margin: 0; 
             font-size: 13px;
             margin-top: 8px; 
             color: #C2C2C2;
         }
    </style>
       
	<body>
    <br>
	  <div class="box">
	  	<img id="1" src="https://map18.mini1.cn/map/18/20260430/399e132218080df3479febda9a4d7100.png" alt="游戏截图"/>
          <div class="text-group">
              <h6 id="2" class="title-main">勇敢者僵尸生存</h6>
              <h6 id="3" class="title-sub">魂之绫</h6>
          </div>
	  </div>
    	
	</body>
</html>
